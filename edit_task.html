{% extends "base.html" %}
{% block title %}Edit Task — TaskBoard{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>Edit task</h1>
    <p class="page-sub">Update the details of this assignment.</p>
  </div>
</div>

<div class="form-card">
  <form id="edit-task-form" class="task-form" data-task-id="{{ task.id }}">
    <label for="title">Title *</label>
    <input type="text" id="title" name="title" value="{{ task.title }}" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4">{{ task.description }}</textarea>

    <div class="form-row">
      <div class="form-field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" value="{{ task.subject }}">
      </div>
      <div class="form-field">
        <label for="due_date">Due date</label>
        <input type="date" id="due_date" name="due_date" value="{{ task.due_date }}">
      </div>
    </div>

    <div class="form-row">
      <div class="form-field">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
          <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
          <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
        </select>
      </div>
      <div class="form-field">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
          <option value="Completed" {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>
        </select>
      </div>
    </div>

    <div id="form-error" class="form-error" style="display:none;"></div>

    <div class="form-actions">
      <a href="{{ url_for('tasks_page') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", initEditTaskForm);
</script>
{% endblock %}
