{% extends "base.html" %}
{% block title %}Sign up — TaskBoard{% endblock %}
{% block bodyclass %}public{% endblock %}

{% block public_content %}
<div class="auth-page">
  <div class="auth-card">
    <a href="{{ url_for('index') }}" class="brand auth-brand">
      <span class="brand-mark">S</span>
      <span class="brand-name">TaskBoard</span>
    </a>
    <h1>Create your account</h1>
    <p class="auth-sub">Start tracking your assignments in under a minute.</p>

    <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="e.g. Nanu Sharma" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">

      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
