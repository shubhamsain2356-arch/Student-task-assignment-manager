{% extends "base.html" %}
{% block title %}Add Task — TaskBoard{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>Add a new task</h1>
    <p class="page-sub">Fill in the details of your assignment below.</p>
  </div>
</div>

<div class="form-card">
  <form id="add-task-form" class="task-form">
    <label for="title">Title *</label>
    <input type="text" id="title" name="title" placeholder="e.g. Operating Systems Assignment 2" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4" placeholder="Any extra notes about this task..."></textarea>

    <div class="form-row">
      <div class="form-field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="e.g. Data Structures">
      </div>
      <div class="form-field">
        <label for="due_date">Due date</label>
        <input type="date" id="due_date" name="due_date">
      </div>
    </div>

    <label for="priority">Priority</label>
    <select id="priority" name="priority">
      <option value="Low">Low</option>
      <option value="Medium" selected>Medium</option>
      <option value="High">High</option>
    </select>

    <div id="form-error" class="form-error" style="display:none;"></div>

    <div class="form-actions">
      <a href="{{ url_for('tasks_page') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Add task</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", initAddTaskForm);
</script>
{% endblock %}
